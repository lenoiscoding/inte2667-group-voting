# Req 6 - TLS in front of the Flask app.
# Port 80 only redirects to HTTPS. Everything else, including ballots, travels
# over TLS 1.2/1.3 to this proxy, which passes it to the app on the private
# Docker network (the app's own port is not published to the host).

server_tokens off;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # TLS 1.2: forward-secret, authenticated (AEAD) suites only.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # Browsers that have seen this header refuse plain HTTP to the site for a year.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Pages cannot be framed by another site (clickjacking), the browser must
    # not guess content types, and no URL leaks to other sites.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        # Overwrite (not append to) any client-supplied value, so the app's
        # login log (Req 4) records the real client IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
