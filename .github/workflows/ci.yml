# Runs on every push and pull request: the unit tests, then Bandit (a security
# linter for Python), so a change that breaks a security control or adds
# insecure code is caught before it is merged.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt bandit==1.8.0
      - name: Unit tests
        run: pytest -q
      - name: Security lint (Bandit)
        run: bandit -q -r app -x app/storage/test_storage.py -ll
