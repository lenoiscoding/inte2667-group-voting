services:
  # Req 6: the only published ports. nginx terminates TLS and forwards to web.
  proxy:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs
    depends_on:
      - web
    restart: unless-stopped

  web:
    build: .
    # Not published to the host: reachable only through the TLS proxy (Req 6).
    expose:
      - "5000"
    environment:
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}"
      # Req 21: the web app logs in as the least-privilege role, never as the owner.
      DATABASE_URL: "postgresql+psycopg2://evoting_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db:5432/evoting"
      BEHIND_TLS_PROXY: "1"
      # Req 8/11: AES-256 key (64 hex characters). Required.
      AES_KEY: "${AES_KEY:?Set AES_KEY in .env}"
      # Req 2 and 3: the report's values unless .env shortens them for a demo.
      SESSION_TIMEOUT_SECONDS: "${SESSION_TIMEOUT_SECONDS:-900}"
      LOCKOUT_MAX_ATTEMPTS: "${LOCKOUT_MAX_ATTEMPTS:-5}"
      LOCKOUT_WINDOW_SECONDS: "${LOCKOUT_WINDOW_SECONDS:-600}"
      LOCKOUT_SECONDS: "${LOCKOUT_SECONDS:-900}"
      # Req 13: optional email settings (blank = no email).
      MAIL_SERVER: "${MAIL_SERVER:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_DEFAULT_SENDER: "${MAIL_DEFAULT_SENDER:-}"
    depends_on:
      db:
        condition: service_healthy
      admin:
        condition: service_completed_successfully  # Req 21: tables and grants exist first
    restart: unless-stopped
    healthcheck:
      # Req 22: /health also checks the database. If it fails 3 times in a
      # row, interrupt the app (Python stops the server on SIGINT); the app
      # exits and the restart policy above starts it again within seconds.
      test: ["CMD-SHELL", "curl -fsS --max-time 3 --retry 2 --retry-delay 2 --retry-all-errors http://localhost:5000/health > /dev/null || kill -INT 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  # Req 21: runs as the database owner (the admin role). On `docker compose up`
  # it creates any missing tables and grants evoting_app only what the web app
  # needs, then exits. Election officials run their commands with it too:
  #   docker compose run --rm admin flask --app run count-votes
  admin:
    build: .
    command: ["flask", "--app", "run", "init-db"]
    environment:
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"  # same as web: signs the count (Req 19)
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}"
      AES_KEY: "${AES_KEY:?Set AES_KEY in .env}"  # same as web: encrypts the electoral roll (Req 8, 20)
      DATABASE_URL: "postgresql+psycopg2://evoting:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/evoting"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evoting
      POSTGRES_USER: evoting
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evoting -d evoting"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Req 11: encrypted point-in-time snapshot of the database.
  #   docker compose run --rm backup   ->   backups/<time>.db.enc + .sha256
  backup:
    build:
      context: .
      dockerfile: app/storage/backup.Dockerfile
    profiles: ["tools"]
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      AES_KEY: "${AES_KEY:?Set AES_KEY in .env}"
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  certs:
