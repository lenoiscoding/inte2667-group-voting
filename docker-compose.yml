services:
  # Req 6: the only published ports. nginx terminates TLS and forwards to web.
  proxy:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs
    depends_on:
      - web
    restart: unless-stopped

  web:
    build: .
    # Not published to the host: reachable only through the TLS proxy (Req 6).
    expose:
      - "5000"
    environment:
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}"
      DATABASE_URL: "postgresql+psycopg2://evoting:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/evoting"
      BEHIND_TLS_PROXY: "1"
      # Req 8/11: AES-256 key (64 hex chars). Blank = built-in test key.
      AES_KEY: "${AES_KEY:-}"
      # Req 13: optional email settings (blank = no email).
      MAIL_SERVER: "${MAIL_SERVER:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_DEFAULT_SENDER: "${MAIL_DEFAULT_SENDER:-}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evoting
      POSTGRES_USER: evoting
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evoting -d evoting"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Req 11: encrypted point-in-time snapshot of the database.
  #   docker compose run --rm backup   ->   backups/<time>.db.enc + .sha256
  backup:
    build:
      context: .
      dockerfile: app/storage/backup.Dockerfile
    profiles: ["tools"]
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      AES_KEY: "${AES_KEY:-}"
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  certs:
