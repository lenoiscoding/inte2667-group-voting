<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Election System Registration</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/login.css') }}"
    />
    <script
      src="{{ url_for('static', filename='js/password_toggle.js') }}"
      defer
    ></script>
  </head>

  <body>
    <div class="login-container">
      <div class="login-box">
        <h1>Election System</h1>
        <p class="subtitle">Voter Registration</p>

        {% if message %}
        <p
          style="text-align: center; color: {{ '#2e7d32' if success else '#c62828' }}"
        >
          {{ message }}
        </p>
        {% endif %} {% if success and qr_code %}
        <h2>Set Up Google Authenticator</h2>
        <p>Scan this QR code using Google Authenticator.</p>

        <img
          src="data:image/png;base64,{{ qr_code }}"
          alt="Google Authenticator QR code"
          width="220"
          height="220"
        />

        <p>Enter the six-digit code when logging in.</p>
        <a href="{{ url_for('auth.login') }}">Go to Login</a>

        {% else %}

        <form method="POST" action="/registration/register">
          <label for="full_name">Full name</label>
          <input type="text" id="full_name" name="full_name" required />

          <label for="date_of_birth">Date of birth</label>
          <input type="date" id="date_of_birth" name="date_of_birth" required />

          <label for="address">Address</label>
          <input type="text" id="address" name="address" required />
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            maxlength="254"
            autocomplete="email"
            placeholder="Enter your email address"
            required
          />
          <label for="id_document_number">Identity document number</label>
          <input
            type="text"
            id="id_document_number"
            name="id_document_number"
            placeholder="Driver licence or passport number"
            required
          />

          <label for="username">Username</label>
          <input type="text" id="username" name="username" required />

          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            minlength="12"
            required
          />

          <button type="submit">Register</button>
        </form>

        <p style="text-align: center">
          <a href="/auth/login">Already registered? Log in</a>
        </p>

        {% endif %}
      </div>
    </div>
  </body>
</html>
